<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realty Photo AI</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/common.css" />
<style>
  .viewtabs { display: inline-flex; background: #f1eee8; border-radius: 10px; padding: 3px; }
  .viewtabs button { border: 0; background: none; font: inherit; font-weight: 700; font-size: 14px; padding: 7px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); }
  .viewtabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 5px 5px 5px 12px; font-weight: 700; font-size: 14px; }
  .chip .n { font-variant-numeric: tabular-nums; }
  .chip.low { border-color: var(--warn); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); border: 0; font: inherit; font-weight: 800; cursor: pointer; }
  @media (max-width: 760px) { header.top { padding: 10px 12px; } .brand span.txt { display: none; } .viewtabs button { padding: 7px 10px; } }

  main { display: grid; grid-template-columns: 380px 1fr; gap: 24px; padding: 24px 28px 60px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; padding: 16px; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .side { display: flex; flex-direction: column; gap: 18px; align-self: start; position: sticky; top: 80px; }
  @media (max-width: 960px) { .side { position: static; } }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 700; }

  .drop { border: 2px dashed #cfc9bd; border-radius: 12px; padding: 22px 14px; text-align: center; cursor: pointer; transition: .15s; background: #faf9f6; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop b { display: block; font-size: 15px; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 13px; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .thumbs div { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #eee; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; cursor: pointer; line-height: 20px; padding: 0; }

  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preset { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 11px; cursor: pointer; font: inherit; color: inherit; transition: .12s; }
  .preset:hover { border-color: #bdb6a8; }
  .preset.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .preset .t { font-weight: 700; font-size: 14px; }
  .preset .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  textarea { min-height: 92px; resize: vertical; font-size: 13px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; gap: 9px; align-items: flex-start; margin-top: 12px; font-size: 14px; cursor: pointer; }
  .check input { margin-top: 3px; accent-color: var(--accent); }
  .check small { display: block; color: var(--muted); font-size: 12px; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0; margin-top: 10px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

  .results-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .results-head h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
  .results-head p { margin: 4px 0 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 18px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .ba { position: relative; aspect-ratio: 3/2; background: #e9e6df; overflow: hidden; user-select: none; }
  .ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .ba .before { clip-path: inset(0 50% 0 0); }
  .ba .bar { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.35); pointer-events: none; }
  .ba .bar::after { content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .ba input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .tag { position: absolute; top: 10px; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.55); color: #fff; letter-spacing: .04em; text-transform: uppercase; pointer-events: none; }
  .tag.l { left: 10px; } .tag.r { right: 10px; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(245,243,239,.55); backdrop-filter: blur(2px); }
  .overlay .box { background: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .spin { width: 18px; height: 18px; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; flex-wrap: wrap; }
  .meta .name { font-weight: 700; font-size: 14px; word-break: break-word; }
  .meta .sub { font-size: 12px; color: var(--muted); }
  .meta .err { font-size: 12px; color: var(--warn); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 70px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); background: #faf9f6; }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }

  .history { max-width: 1500px; margin: 0 auto; padding: 24px 28px 60px; }
  @media (max-width: 960px) { .history { padding: 16px; } }

  .banner { background: #fff7e3; border: 1px solid #f0d9a0; border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; place-items: center; z-index: 60; padding: 20px; }
  .modal-bg.show { display: grid; }
  .modal-bg .ba { width: min(1400px, 94vw); aspect-ratio: auto; height: 86vh; background: #111; border-radius: 10px; }
  .modal-bg .close { position: absolute; top: 14px; right: 18px; color: #fff; font-size: 30px; background: none; border: 0; cursor: pointer; }

  .copyrow { display: flex; gap: 8px; }
  .copyrow input { font-size: 13px; }
  .refstats { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .refstats b { color: var(--ink); font-size: 18px; display: block; }
  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" id="brand"></a>
  <div class="viewtabs" id="viewtabs">
    <button data-view="edit" class="on" data-i18n="tabEdit"></button>
    <button data-view="history" data-i18n="tabHistory"></button>
  </div>
  <div class="hright">
    <div class="chip" id="chip"><span>🪙 <span class="n" id="credits">–</span></span><button class="btn sm" id="topUp" data-i18n="topUp"></button></div>
    <span id="langSlot"></span>
    <button class="avatar" id="avatar" title="Account">·</button>
  </div>
</header>

<!-- ============ Обработка ============ -->
<div id="viewEdit">
<main>
  <aside class="side">
    <div class="banner" id="lowBanner" hidden><span id="lowText"></span><button class="btn sm gold" data-i18n="topUp" onclick="openPricing()"></button></div>
    <section class="panel">
      <h2 data-i18n="s1"></h2>
      <div class="drop" id="drop">
        <b data-i18n="dropB"></b>
        <span data-i18n="dropS"></span>
        <input type="file" id="file" accept="image/*" multiple hidden />
      </div>
      <div class="thumbs" id="thumbs"></div>
    </section>

    <section class="panel">
      <h2 data-i18n="s2"></h2>
      <div class="presets" id="presets"></div>
      <div id="styleWrap" hidden>
        <label class="f" for="style" data-i18n="style"></label>
        <select id="style">
          <option data-i18n="st_scandi" value="Scandinavian: light oak wood, white and beige textiles, cozy minimal decor"></option>
          <option data-i18n="st_modern" value="modern contemporary: clean lines, neutral palette with warm accents, designer lighting"></option>
          <option data-i18n="st_min" value="minimalist: very few pieces, calm neutral tones, uncluttered"></option>
          <option data-i18n="st_loft" value="industrial loft: leather, dark metal, warm wood, Edison lamps"></option>
          <option data-i18n="st_classic" value="classic elegant: upholstered furniture, soft patterns, brass details"></option>
          <option data-i18n="st_med" value="Mediterranean: natural linen, rattan, terracotta, olive greens"></option>
          <option data-i18n="st_lux" value="luxury premium: high-end designer furniture, marble, velvet, statement chandelier"></option>
        </select>
        <label class="f" for="room" data-i18n="room"></label>
        <select id="room">
          <option data-i18n="r_auto" value="the appropriate room type"></option>
          <option data-i18n="r_living" value="a living room"></option>
          <option data-i18n="r_bed" value="a bedroom"></option>
          <option data-i18n="r_kitchen" value="a kitchen with dining area"></option>
          <option data-i18n="r_office" value="a home office"></option>
          <option data-i18n="r_kids" value="a kids room"></option>
          <option data-i18n="r_dining" value="a dining room"></option>
          <option data-i18n="r_terrace" value="a terrace / balcony with outdoor furniture"></option>
        </select>
      </div>
      <div id="customWrap" hidden>
        <label class="f" for="custom" data-i18n="customL"></label>
        <textarea id="custom" data-i18n-ph="customPh"></textarea>
      </div>
      <button class="link" id="togglePrompt"></button>
      <textarea id="promptView" hidden></textarea>
    </section>

    <section class="panel">
      <h2 data-i18n="s3"></h2>
      <div class="row">
        <div>
          <label class="f" for="model" style="margin-top:0" data-i18n="model"></label>
          <select id="model">
            <option value="fal-ai/nano-banana-pro/edit" data-i18n="m_pro"></option>
            <option value="fal-ai/nano-banana/edit" data-i18n="m_std"></option>
          </select>
        </div>
        <div>
          <label class="f" for="res" style="margin-top:0" data-i18n="res"></label>
          <select id="res">
            <option value="1K">1K</option>
            <option value="2K" selected>2K</option>
            <option value="4K" data-i18n="res4k"></option>
          </select>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="upscale" />
        <span><span data-i18n="upscale"></span><small data-i18n="upscaleS"></small></span></label>
      <label class="check"><input type="checkbox" id="mark" checked />
        <span><span data-i18n="mark"></span><small data-i18n="markS"></small></span></label>
    </section>

    <button class="btn full lg" id="run" disabled></button>
    <div class="hint" id="runHint"></div>
  </aside>

  <section>
    <div class="results-head">
      <div>
        <h1 data-i18n="results"></h1>
        <p data-i18n="resultsP"></p>
      </div>
      <button class="btn ghost sm" id="dlAll" hidden data-i18n="dlAll"></button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">
      <div style="font-size:42px">🏠</div>
      <b data-i18n="emptyB"></b>
      <span data-i18n="emptyP"></span>
    </div>
  </section>
</main>
</div>

<!-- ============ История ============ -->
<div id="viewHistory" hidden>
  <div class="history">
    <div class="results-head"><div><h1 data-i18n="tabHistory"></h1><p data-i18n="historyP"></p></div></div>
    <div class="grid" id="histGrid"></div>
    <div class="empty" id="histEmpty" hidden><b data-i18n="histEmptyB"></b><span data-i18n="histEmptyP"></span></div>
    <div style="text-align:center;margin-top:18px"><button class="btn ghost" id="histMore" hidden data-i18n="more"></button></div>
  </div>
</div>

<!-- ============ Аккаунт ============ -->
<div class="dlg-bg" id="accDlg">
  <div class="dlg">
    <button class="x" onclick="$('#accDlg').classList.remove('show')">×</button>
    <h3 data-i18n="account"></h3>
    <p class="sub" id="accEmail"></p>
    <h2 style="margin-top:14px" data-i18n="inviteTitle"></h2>
    <p class="sub" id="inviteText" style="margin-bottom:10px"></p>
    <div class="copyrow"><input type="text" id="refLink" readonly /><button class="btn sm" id="copyRef" data-i18n="copy"></button></div>
    <div class="refstats"><div><b id="refInvited">0</b><span data-i18n="invited"></span></div><div><b id="refPaid">0</b><span data-i18n="bought"></span></div></div>
    <hr class="sep" />
    <h2 data-i18n="changePass"></h2>
    <input type="password" id="pwCur" data-i18n-ph="curPass" autocomplete="current-password" />
    <input type="password" id="pwNew" data-i18n-ph="newPass" autocomplete="new-password" style="margin-top:8px" />
    <div class="form-err" id="pwErr"></div>
    <button class="btn ghost sm" id="pwSave" data-i18n="save"></button>
    <hr class="sep" />
    <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">
      <a class="btn ghost sm" href="/admin" id="adminLink" hidden>Admin</a>
      <button class="btn ghost sm" id="logout" data-i18n="logout"></button>
    </div>
    <details style="margin-top:16px;font-size:13px">
      <summary style="cursor:pointer;color:var(--muted)" data-i18n="deleteAcc"></summary>
      <p class="sub" style="margin:8px 0" data-i18n="deleteWarn"></p>
      <input type="password" id="delPass" data-i18n-ph="curPass" autocomplete="current-password" />
      <div class="form-err" id="delErr"></div>
      <button class="btn sm" id="delGo" style="background:var(--warn)" data-i18n="deleteAcc"></button>
    </details>
    <div class="fine" id="accLegal" style="margin-top:16px"></div>
  </div>
</div>

<div class="modal-bg" id="modal"><button class="close" id="modalClose">×</button><div id="modalBody"></div></div>

<script src="/common.js"></script>
<script>
// ---------- строки приложения ----------
Object.assign(PAGE_I18N.ru, {
  deleteAcc: "Удалить аккаунт", deleteWarn: "Фото и история будут удалены, неиспользованные кредиты пропадут. Это действие нельзя отменить.",
  tabEdit: "Обработка", tabHistory: "История",
  s1: "1. Фото объекта", dropB: "Перетащите фото сюда", dropS: "или нажмите, чтобы выбрать · JPG, PNG, WebP · можно несколько",
  s2: "2. Что сделать", style: "Стиль интерьера", room: "Тип комнаты",
  st_scandi: "Скандинавский", st_modern: "Современный", st_min: "Минимализм", st_loft: "Лофт", st_classic: "Классика", st_med: "Средиземноморский", st_lux: "Премиум",
  r_auto: "Определить автоматически", r_living: "Гостиная", r_bed: "Спальня", r_kitchen: "Кухня-столовая", r_office: "Кабинет", r_kids: "Детская", r_dining: "Столовая", r_terrace: "Терраса / балкон",
  customL: "Ваша инструкция (на любом языке)", customPh: "Например: сделай стены светло-серыми, убери машину у подъезда",
  showPrompt: "Показать промпт ▾", hidePrompt: "Скрыть промпт ▴",
  s3: "3. Качество", model: "Модель", m_pro: "Pro — лучшее качество", m_std: "Стандарт — быстрее", res: "Разрешение", res4k: "4K (2 кредита)",
  upscale: "Апскейл ×2 после обработки", upscaleS: "Бесплатно · больше деталей для печати и крупных экранов",
  mark: "Помечать «Виртуальный стейджинг»", markS: "Надпись в углу при скачивании — требование многих порталов",
  run: "Обработать", runN: (n, c) => `Обработать ${n} фото · ${c} ${plural(c, "кредит", "кредита", "кредитов")}`,
  runNeed: (c) => `Нужно ${c} ${plural(c, "кредит", "кредита", "кредитов")} — пополнить`,
  hintAdd: "Добавьте хотя бы одно фото", hintPro: "≈ 20–60 сек на фото", hintStd: "≈ 10–20 сек на фото",
  results: "Результаты", resultsP: "Двигайте ползунок, чтобы сравнить «до» и «после». ⤢ — на весь экран.",
  dlAll: "Скачать все", emptyB: "Здесь появятся улучшенные фото", emptyP: "Загрузите снимки слева, выберите задачу и нажмите «Обработать».",
  historyP: "Все обработанные фото. Можно скачать повторно.", histEmptyB: "Пока пусто", histEmptyP: "Обработанные фото будут сохраняться здесь.", more: "Показать ещё",
  st_wait: "Ожидание…", st_send: "Отправка…", st_proc: (s) => `Обработка… ${s} с`, st_done: "Готово", st_err: "Ошибка — кредит возвращён",
  e_noimg: "Модель не вернула изображение", e_long: "Слишком долго, попробуйте ещё раз", e_open: (n) => `Не удалось открыть ${n}`,
  before: "До", after: "После", full: "На весь экран", dl: "Скачать", again: "Ещё вариант", retry: "Повторить", del: "Удалить", plusUp: " + апскейл", remove: "Убрать",
  watermark: "Виртуальный стейджинг · изображение изменено",
  lowCredits: (n) => n > 0 ? `Осталось ${n} ${plural(n, "фото", "фото", "фото")}` : "Кредиты закончились",
  account: "Аккаунт", inviteTitle: "Пригласить коллег",
  inviteText: (b, w) => `Коллега получит +${w} фото к подарку, а вы — +${b} фото после его первой покупки.`,
  copy: "Копировать", copied: "Ссылка скопирована", invited: "зарегистрировались", bought: "купили пакет",
  changePass: "Сменить пароль", curPass: "Текущий пароль", newPass: "Новый пароль (мин. 8 символов)", save: "Сохранить", saved: "Сохранено",
  welcome: (n) => `Добро пожаловать! У вас ${n} бесплатных фото 🎁`,
  p_enhance: ["✨ Авто‑улучшение", "Свет, HDR, баланс белого, вертикали"], p_staging: ["🛋️ Меблировка", "Расставить мебель в пустой комнате"],
  p_declutter: ["🧹 Убрать хлам", "Личные вещи, провода, мусор"], p_empty: ["⬜ Пустая комната", "Убрать всю мебель"],
  p_sky: ["☀️ Замена неба", "Голубое небо, солнечный день"], p_twilight: ["🌆 Вечерняя съёмка", "Сумерки, тёплый свет в окнах"],
  p_lawn: ["🌿 Благоустройство", "Зелёный газон, чистый двор"], p_refresh: ["🎨 Освежить ремонт", "Покраска стен, чистые поверхности"],
  p_upscale: ["🔍 Только апскейл", "Резкость и разрешение ×2"], p_custom: ["✍️ Своя задача", "Опишите, что изменить"],
});
Object.assign(PAGE_I18N.es, {
  deleteAcc: "Eliminar cuenta", deleteWarn: "Se borrarán tus fotos e historial y perderás los créditos no usados. No se puede deshacer.",
  tabEdit: "Editar", tabHistory: "Historial",
  s1: "1. Fotos del inmueble", dropB: "Arrastra las fotos aquí", dropS: "o haz clic para elegir · JPG, PNG, WebP · varias a la vez",
  s2: "2. Qué hacer", style: "Estilo de interior", room: "Tipo de estancia",
  st_scandi: "Nórdico", st_modern: "Moderno", st_min: "Minimalista", st_loft: "Industrial / loft", st_classic: "Clásico", st_med: "Mediterráneo", st_lux: "Lujo",
  r_auto: "Detectar automáticamente", r_living: "Salón", r_bed: "Dormitorio", r_kitchen: "Cocina-comedor", r_office: "Despacho", r_kids: "Habitación infantil", r_dining: "Comedor", r_terrace: "Terraza / balcón",
  customL: "Tu instrucción (en cualquier idioma)", customPh: "Por ejemplo: pinta las paredes de gris claro, quita el coche de la entrada",
  showPrompt: "Ver prompt ▾", hidePrompt: "Ocultar prompt ▴",

  { id: "refresh", staging: true, p: () => `${BASE} Make the interior look freshly renovated: walls repainted in a clean warm white, remove stains, scuffs and cracks, clean and polish floors, tiles and surfaces. Keep the same materials, layout and furniture.` },

// ---------- файлы ----------
let files = [];
const drop = $("#drop");
drop.onclick = () => $("#file").click();
$("#file").onchange = (e) => addFiles(e.target.files);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); };

async function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith("image/")) continue;
    try {
      const { full, thumb } = await prepImage(f);
      files.push({ id: crypto.randomUUID(), name: f.name.replace(/\.[^.]+$/, ""), dataUrl: full, thumb });
    } catch { toast(t("e_open", f.name)); }
  }
  $("#file").value = "";
  renderThumbs();
}
function prepImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const draw = (max, q) => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", q);
      };
      const out = { full: draw(2560, 0.92), thumb: draw(900, 0.8) };
      URL.revokeObjectURL(url);
      resolve(out);
    };
    img.onerror = reject;
    img.src = url;
  });
}
function renderThumbs() {
  $("#thumbs").innerHTML = "";
  files.forEach((f) => {
    const d = document.createElement("div");
    d.innerHTML = `<img src="${f.thumb}" alt=""><button title="${t("remove")}">×</button>`;
    d.querySelector("button").onclick = () => { files = files.filter((x) => x !== f); renderThumbs(); };
    $("#thumbs").appendChild(d);
  });
  updateRun();
}
function updateRun() {
  const need = files.length * costPerPhoto();
  const enough = need <= credits;
  $("#run").disabled = !files.length;
  $("#run").classList.toggle("gold", files.length > 0 && !enough);
  $("#run").textContent = !files.length ? t("run") : enough ? t("runN", files.length, need) : t("runNeed", need);
  $("#runHint").textContent = !files.length ? t("hintAdd") : $("#model").value.includes("pro") ? t("hintPro") : t("hintStd");
}
["#model", "#res"].forEach((s) => $(s).addEventListener("change", updateRun));

// ---------- обработка ----------
const jobs = []; // {file, settings, state, serverId, resultUrl, error, el, started}
$("#run").onclick = () => {
  const need = files.length * costPerPhoto();
  if (need > credits) return openPricing();
  const settings = {
    presetId: preset.id, prompt: currentPrompt(), model: $("#model").value, res: $("#res").value,
    upscale: $("#upscale").checked && !preset.upscaleOnly,
  };
  for (const f of files) {
    const job = { file: f, settings, state: "wait" };
    jobs.unshift(job);
    createCard(job);
  }
  files = []; renderThumbs();
  $("#empty").hidden = true;
  pump();
};
let active = 0;
function pump() {
  while (active < 3) {
    const job = jobs.slice().reverse().find((j) => j.state === "wait");
    if (!job) break;
    active++;
    processJob(job).finally(() => { active--; pump(); });
  }
}
async function processJob(job) {
  const s = job.settings;
  const set = (o) => { Object.assign(job, o); if (job.state !== "deleted") updateCard(job); };
  set({ state: "send", error: null, resultUrl: null });
  try {
    const r = await api("/api/jobs", {
      preset: s.presetId, prompt: s.prompt, model: s.model, resolution: s.res, upscale: s.upscale,
      image: job.file.dataUrl, thumb: job.file.thumb, name: job.file.name,
    });
    setCredits(r.credits);
    job.serverId = r.id; job.started = Date.now();
    while (true) {
      await new Promise((res) => setTimeout(res, 2000));
      set({ state: "proc" });
      const st = await api(`/api/jobs/${r.id}`);
      if (st.job.status === "done") { setCredits(st.credits); set({ state: "done", resultUrl: st.job.result_url }); break; }
      if (st.job.status === "failed") { setCredits(st.credits); set({ state: "err", error: t("st_err") }); break; }
      if (Date.now() - job.started > 8 * 60 * 1000) throw Object.assign(new Error(), { code: "long" });
    }
  } catch (e) {
    if (e.code === "no_credits") openPricing();
    set({ state: "err", error: e.code === "long" ? t("e_long") : errText(e.code) });
  }
  $("#dlAll").hidden = !jobs.some((j) => j.resultUrl);
}

// ---------- карточки ----------
const resultSrc = (url) => `/api/download?inline=1&url=${encodeURIComponent(url)}`;
function baHTML(before, after) {
  return `<div class="ba">
    <img class="after" src="${after || before}" alt="${t("after")}" loading="lazy">
    <img class="before" src="${before}" alt="${t("before")}" loading="lazy">
    <div class="bar"></div>
    <span class="tag l">${t("before")}</span><span class="tag r">${t("after")}</span>
    <input type="range" min="0" max="100" value="50" aria-label="${t("before")} / ${t("after")}">
  </div>`;
}
function wireBA(root) {
  const range = root.querySelector("input[type=range]");
  const apply = () => {
    root.querySelector(".before").style.clipPath = `inset(0 ${100 - range.value}% 0 0)`;
    root.querySelector(".bar").style.left = range.value + "%";
  };
  range.oninput = apply; apply();
}
function statusText(job) {
  if (job.state === "wait") return t("st_wait");
  if (job.state === "send") return t("st_send");
  return t("st_proc", Math.round((Date.now() - (job.started || Date.now())) / 1000));
}
function cardHTML({ before, resultUrl, name, presetId, upscale, error, busyText, actions }) {
  const done = !!resultUrl;
  const [title] = t("p_" + presetId);
  return `${baHTML(before, done ? resultSrc(resultUrl) : null)}
    <div class="meta">
      <div><div class="name">${escapeHtml(name)}</div>
        <div class="sub">${title}${upscale && presetId !== "upscale" ? t("plusUp") : ""}</div>
        ${error ? `<div class="err">${escapeHtml(error)}</div>` : ""}</div>
      <div class="actions">${actions}</div>
    </div>`;
}
function finishCard(el, { done, busyText }) {
  if (busyText) el.querySelector(".ba").insertAdjacentHTML("beforeend", `<div class="overlay"><div class="box"><div class="spin"></div>${escapeHtml(busyText)}</div></div>`);
  if (!done) el.querySelectorAll(".ba .bar, .ba .tag, .ba input").forEach((n) => (n.style.display = "none"));
  else wireBA(el);
}
function createCard(job) {
  const el = document.createElement("div");
  el.className = "card"; job.el = el;
  $("#grid").prepend(el);
  updateCard(job);
}
function updateCard(job) {
  const done = job.state === "done";
  const busy = !done && job.state !== "err";
  job.el.innerHTML = cardHTML({
    before: job.file.thumb, resultUrl: done ? job.resultUrl : null, name: job.file.name,
    presetId: job.settings.presetId, upscale: job.settings.upscale, error: job.error,
    actions: `${done ? `<button class="btn ghost sm" data-a="full" title="${t("full")}">⤢</button><button class="btn ghost sm" data-a="dl">${t("dl")}</button>` : ""}
      ${!busy ? `<button class="btn ghost sm" data-a="retry">${done ? t("again") : t("retry")}</button>` : ""}
      ${!busy ? `<button class="btn ghost sm" data-a="del" title="${t("del")}">🗑</button>` : ""}`,
  });
  finishCard(job.el, { done, busyText: busy ? statusText(job) : null });
  job.el.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => {
    const a = b.dataset.a;
    if (a === "dl") return download(job.resultUrl, job.file.name, job.settings.presetId);
    if (a === "full") return openModal(job.file.thumb, job.resultUrl);
    if (a === "retry") {
      if (costPerJob(job) > credits) return openPricing();
      job.state = "wait"; updateCard(job); pump(); return;
    }
    if (a === "del") { jobs.splice(jobs.indexOf(job), 1); job.el.remove(); job.state = "deleted"; $("#empty").hidden = jobs.length > 0; }
  }));
}
const costPerJob = (job) => (job.settings.presetId === "upscale" ? 1 : job.settings.model.includes("pro") && job.settings.res === "4K" ? 2 : 1);

        ${["done", "failed"].includes(j.status) ? `<button class="btn ghost sm" data-a="del" title="${t("del")}">🗑</button>` : ""}`,

    }));

// ---------- скачивание с пометкой ----------
async function download(url, name, presetId) {
  const fname = `${name}_${presetId}.jpg`;
  const needMark = $("#mark").checked && presetById(presetId).staging;
  try {
    let blob = await (await fetch(resultSrc(url))).blob();
    if (needMark) blob = await addLabel(blob, t("watermark"));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch {
    location.href = `/api/download?url=${encodeURIComponent(url)}&name=${encodeURIComponent(fname)}`;
  }
}
function addLabel(blob, text) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const g = c.getContext("2d");
      g.drawImage(img, 0, 0);
      const fs = Math.max(14, Math.round(c.width / 70));
      g.font = `600 ${fs}px Manrope, sans-serif`;
      const pad = fs * 0.6, w = g.measureText(text).width + pad * 2, h = fs + pad * 1.4;
      const x = c.width - w - fs, y = c.height - h - fs;
      g.fillStyle = "rgba(0,0,0,0.55)";
      g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, fs * 0.4) : g.rect(x, y, w, h); g.fill();
      g.fillStyle = "#fff"; g.textBaseline = "middle";
      g.fillText(text, x + pad, y + h / 2);
      c.toBlob((b) => (b ? resolve(b) : reject()), "image/jpeg", 0.93);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}
$("#dlAll").onclick = async () => {
  for (const j of jobs.filter((j) => j.resultUrl)) { await download(j.resultUrl, j.file.name, j.settings.presetId); await new Promise((r) => setTimeout(r, 400)); }
};

// ---------- полноэкранный режим ----------
function openModal(before, url) {
  $("#modalBody").innerHTML = baHTML(before, resultSrc(url));
  wireBA($("#modalBody"));
  $("#modal").classList.add("show");
}
$("#modalClose").onclick = () => $("#modal").classList.remove("show");
$("#modal").onclick = (e) => { if (e.target.id === "modal") $("#modal").classList.remove("show"); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $$(".modal-bg.show, .dlg-bg.show").forEach((m) => { if (m.id !== "authDlg") m.classList.remove("show"); }); });

// ---------- аккаунт ----------
let REFS = { invited: 0, paid: 0 };
function renderAccount() {
  if (!window.ME) return;
  $("#avatar").textContent = ME.email[0].toUpperCase();
  $("#accEmail").textContent = ME.email;
  $("#refLink").value = `${location.origin}/?ref=${ME.refCode}`;
  $("#inviteText").textContent = t("inviteText", CONFIG?.refBonus ?? 10, CONFIG?.refWelcome ?? 3);
  $("#refInvited").textContent = REFS.invited; $("#refPaid").textContent = REFS.paid;
  $("#adminLink").hidden = !ME.isAdmin;
  $("#accLegal").innerHTML = legalLinksHTML();
}
$("#delGo").onclick = async () => {
  $("#delErr").textContent = "";
  try { await api("/api/me/delete", { password: $("#delPass").value }); location.href = "/"; }
  catch (e) { $("#delErr").textContent = errText(e.code); }
};
$("#avatar").onclick = () => { renderAccount(); $("#accDlg").classList.add("show"); };
$("#accDlg").addEventListener("click", (e) => { if (e.target.id === "accDlg") $("#accDlg").classList.remove("show"); });
$("#copyRef").onclick = async () => {
  try { await navigator.clipboard.writeText($("#refLink").value); } catch { $("#refLink").select(); document.execCommand("copy"); }
  toast(t("copied"));
};
$("#pwSave").onclick = async () => {
  $("#pwErr").textContent = "";
  try { await api("/api/me/password", { current: $("#pwCur").value, next: $("#pwNew").value }); toast(t("saved")); $("#pwCur").value = $("#pwNew").value = ""; }
  catch (e) { $("#pwErr").textContent = errText(e.code); }
};
$("#logout").onclick = async () => { await api("/api/auth/logout", {}).catch(() => {}); location.href = "/"; };

// ---------- старт ----------
onLang(() => { renderPresets(); syncPresetUI(); renderThumbs(); jobs.forEach(updateCard); renderAccount(); setCredits(credits); if (!$("#viewHistory").hidden) loadHistory(true); });

async function refreshMe() {
  const me = await api("/api/me");
  window.ME = me.user; REFS = me.referrals;
  setCredits(me.user.credits);
  renderAccount();
  return me;
}
async function start() {
  await loadConfig();
  applyLang();
  try {
    const me = await refreshMe();
    if (me.user.lang && me.user.lang !== lang && !store.get("lang")) setLang(me.user.lang);
  } catch (e) {
    return openAuth(new URLSearchParams(location.search).has("login") ? "in" : "up", {
      locked: true,
      onDone: async (u) => { await refreshMe(); toast(t("welcome", u.credits), 4000); },
    });
  }
  const qs = new URLSearchParams(location.search);
  if (qs.get("paid")) {
    toast(t("paid"), 5000);
    // вебхук может прийти через пару секунд — обновим баланс
    let n = 0; const before = credits;
    const iv = setInterval(async () => { await refreshMe().catch(() => {}); if (credits > before || ++n > 8) clearInterval(iv); }, 2000);
  }
  if (qs.get("canceled")) toast(t("canceled"));
  if (qs.has("paid") || qs.has("canceled")) history.replaceState(null, "", "/app");
  if (location.hash === "#history") showView("history");
}
start();
</script>
