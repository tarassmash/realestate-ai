<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realty Photo AI</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/common.css" />
<style>
  main { max-width: 760px; margin: 0 auto; padding: 16px 24px 80px; }
  @media (max-width: 640px) { main { padding: 8px 16px 60px; } }
  .pill { border: 0; background: var(--soft); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .pill.cta { background: var(--ink); color: #fff; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); border: 0; font-weight: 700; cursor: pointer; }
  .nav { display: flex; gap: 18px; margin: 8px 0 26px; }
  .nav button { border: 0; background: none; padding: 0 0 4px; font-weight: 600; color: #a8a8a8; cursor: pointer; border-bottom: 2px solid transparent; }
  .nav button.on { color: var(--ink); border-color: var(--ink); }

  .drop { border: 1.5px dashed #d6d6d6; border-radius: 22px; padding: 56px 20px; text-align: center; cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--ink); background: var(--soft); }
  .drop b { display: block; font-size: 18px; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 14px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .thumbs div { position: relative; width: 72px; height: 72px; border-radius: 12px; overflow: hidden; background: var(--soft); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs button.rm { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; cursor: pointer; padding: 0; }
  .thumbs .add { width: 72px; height: 72px; border-radius: 12px; border: 1.5px dashed #d6d6d6; background: none; font-size: 22px; color: var(--muted); cursor: pointer; }

  h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 30px 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 0; background: var(--soft); border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink); }
  .chip.on { background: var(--ink); color: #fff; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  @media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
  .run { margin-top: 30px; }
  .hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; }

  .results { display: grid; gap: 28px; margin-top: 40px; }
  .card .ba { position: relative; aspect-ratio: 3/2; background: var(--soft); border-radius: 18px; overflow: hidden; user-select: none; }
  .card .ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .card .ba .before { clip-path: inset(0 50% 0 0); }
  .card .ba .bar { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; pointer-events: none; box-shadow: 0 0 4px rgba(0,0,0,.2); }
  .card .ba input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .card .ba .ov { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.6); backdrop-filter: blur(3px); font-weight: 600; font-size: 14px; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid #d9d9d9; border-top-color: var(--ink); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .card .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 2px 0; flex-wrap: wrap; }
  .card .name { font-weight: 600; font-size: 14px; }
  .card .sub { color: var(--muted); font-size: 13px; }
  .card .err { color: var(--warn); font-size: 13px; }
  .acts { display: flex; gap: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; place-items: center; z-index: 60; padding: 20px; }
  .modal.show { display: grid; }
  .modal .ba { width: min(1400px, 94vw); height: 86vh; aspect-ratio: auto; background: #111; }
  .modal .close { position: absolute; top: 14px; right: 18px; color: #fff; font-size: 28px; background: none; border: 0; cursor: pointer; }

  .acc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .acc-row:first-of-type { border-top: 0; }
  .acc-row .muted { color: var(--muted); }
  .acc-sec { font-size: 12px; color: var(--muted); font-weight: 600; margin: 18px 0 2px; text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" id="brand"></a>
  <div class="hright">
    <button class="pill" id="usage" hidden></button>
    <span id="langSlot"></span>
    <button class="avatar" id="avatar" aria-label="Account">·</button>
  </div>
</header>

<main>

      <span data-i18n="dropS"></span>
    </div>
    <div class="thumbs" id="thumbs" hidden></div>
    <input type="file" id="file" accept="image/*" multiple hidden />

    <h4 data-i18n="whatToDo"></h4>
    <div class="chips" id="chips"></div>
    <div class="opts" id="stagingOpts" hidden>
      <select id="style">
        <option data-i18n="st_scandi" value="Scandinavian: light oak wood, white and beige textiles, cozy minimal decor"></option>
        <option data-i18n="st_modern" value="modern contemporary: clean lines, neutral palette with warm accents, designer lighting"></option>
        <option data-i18n="st_min" value="minimalist: very few pieces, calm neutral tones, uncluttered"></option>
        <option data-i18n="st_loft" value="industrial loft: leather, dark metal, warm wood, Edison lamps"></option>
        <option data-i18n="st_classic" value="classic elegant: upholstered furniture, soft patterns, brass details"></option>
        <option data-i18n="st_med" value="Mediterranean: natural linen, rattan, terracotta, olive greens"></option>
        <option data-i18n="st_lux" value="luxury premium: high-end designer furniture, marble, velvet, statement chandelier"></option>
      </select>
      <select id="room">
        <option data-i18n="r_auto" value="the appropriate room type"></option>
        <option data-i18n="r_living" value="a living room"></option>
        <option data-i18n="r_bed" value="a bedroom"></option>
        <option data-i18n="r_kitchen" value="a kitchen with dining area"></option>
        <option data-i18n="r_office" value="a home office"></option>
        <option data-i18n="r_kids" value="a kids room"></option>
        <option data-i18n="r_dining" value="a dining room"></option>
        <option data-i18n="r_terrace" value="a terrace / balcony with outdoor furniture"></option>
      </select>
    </div>
    <textarea id="custom" rows="2" data-i18n-ph="customPh" style="margin-top:12px" hidden></textarea>

    <div class="run"><button class="btn full lg" id="run" disabled></button><div class="hint" id="runHint"></div></div>

    <div class="results" id="results"></div>
  </div>

  <div id="viewHistory" hidden>
    <div class="results" id="history" style="margin-top:0"></div>
    <div class="empty" id="histEmpty" hidden data-i18n="histEmpty"></div>
    <div style="text-align:center;margin-top:24px"><button class="btn ghost" id="histMore" hidden data-i18n="more"></button></div>
  </div>
</main>

<!-- аккаунт -->
<div class="dlg-bg" id="accDlg">
  <div class="dlg" style="width:min(460px,100%)">
    <button class="x" onclick="$('#accDlg').classList.remove('show')">×</button>
    <h3 id="accEmail" style="font-size:20px;word-break:break-all"></h3>
    <div id="accSub"></div>

    <div class="acc-row"><span data-i18n="inviteTitle"></span><button class="btn ghost sm" id="copyRef" data-i18n="copyLink"></button></div>
    <div class="acc-row" style="display:block">
      <details><summary class="link" data-i18n="changePass" style="text-decoration:none"></summary>
        <input type="password" id="pwCur" data-i18n-ph="curPass" autocomplete="current-password" style="margin-top:10px" />
        <input type="password" id="pwNew" data-i18n-ph="newPass" autocomplete="new-password" style="margin-top:8px" />
        <div class="form-err" id="pwErr"></div>
        <button class="btn sm" id="pwSave" data-i18n="save"></button>
      </details>
    </div>
    <div class="acc-row">
      <button class="link" id="logout" data-i18n="logout"></button>
      <a class="link" href="/admin" id="adminLink" hidden>Admin</a>
    </div>

      <details><summary class="link" style="text-decoration:none;color:var(--warn)" data-i18n="deleteAcc"></summary>
        <p class="sub" style="font-size:13px;margin:8px 0" data-i18n="deleteWarn"></p>
        <input type="password" id="delPass" data-i18n-ph="curPass" autocomplete="current-password" />
        <div class="form-err" id="delErr"></div>
        <button class="btn sm" id="delGo" style="background:var(--warn)" data-i18n="deleteAcc"></button>
      </details>
    </div>
    <div class="fine" id="accLegal"></div>
  </div>
</div>

<div class="modal" id="modal"><button class="close" id="modalClose">×</button><div id="modalBody"></div></div>

$("#brand").innerHTML = BRAND_SVG + "<span class=\"bt\">Realty Photo AI</span>";
$("#langSlot").outerHTML = langSwitcherHTML();

// ---------- доступ: подписка / бесплатные фото ----------
let ENT = { subscription: { active: false }, usage: { used: 0, limit: 15, remaining: 0 }, credits: 0, canProcess: false };
function setEntitlement(e) {
  if (!e) return;
  ENT = { ...ENT, ...e };
  if (window.ME && typeof e.credits === "number") ME.credits = e.credits;
  renderUsage(); updateRun();
}
function renderUsage() {
  const el = $("#usage"), s = ENT.subscription;
  el.hidden = false;
  el.classList.toggle("cta", !s.active && !ENT.credits);
  el.textContent = s.active ? t("usageSub", ENT.usage.remaining, ENT.usage.limit) : ENT.credits > 0 ? t("usageFree", ENT.credits) : t("usageNone");
}
$("#usage").onclick = () => (ENT.subscription.active ? openAccount() : openPaywall());
const fmtDate = (d) => new Date(d).toLocaleDateString(lang === "en" ? "en-US" : lang, { day: "numeric", month: "long" });

// ---------- вкладки ----------
function showView(v) {
  $$(".nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  $("#viewEdit").hidden = v !== "edit";
  $("#viewHistory").hidden = v !== "history";
  if (v === "history") loadHistory(true);
}
$$(".nav button").forEach((b) => (b.onclick = () => showView(b.dataset.view)));

// ---------- инструменты ----------
const presetOpts = () => ({ room: $("#room").value, style: $("#style").value, custom: $("#custom").value });
const PRESETS = PRESET_DEFS.map((d) => ({ ...d, p: () => d.p(presetOpts()) }));
const presetById = (id) => PRESETS.find((p) => p.id === id) || PRESETS[0];
let preset = PRESETS[0];
function renderChips() {
  $("#chips").innerHTML = PRESETS.map((p) => `<button class="chip ${p === preset ? "on" : ""}" data-id="${p.id}">${t("p_" + p.id)}</button>`).join("");
  $$("#chips .chip").forEach((b) => (b.onclick = () => { preset = presetById(b.dataset.id); renderChips(); }));
  $("#stagingOpts").hidden = preset.id !== "staging";
  $("#custom").hidden = preset.id !== "custom";
}

// ---------- фото ----------
let files = [];
const drop = $("#drop");
drop.onclick = () => $("#file").click();
$("#file").onchange = (e) => addFiles(e.target.files);
for (const el of [drop, document.body]) {
  el.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  el.addEventListener("dragleave", () => drop.classList.remove("over"));
  el.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (!$("#viewEdit").hidden) addFiles(e.dataTransfer.files); });
}
async function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith("image/")) continue;
    try {
      const { full, thumb } = await prepImage(f);
      files.push({ id: crypto.randomUUID(), name: f.name.replace(/\.[^.]+$/, ""), dataUrl: full, thumb });
    } catch { toast(t("e_open", f.name)); }
  }
  $("#file").value = "";
  renderThumbs();
}
function prepImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const draw = (max, q) => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", q);
      };
      const out = { full: draw(2560, 0.92), thumb: draw(900, 0.8) };
      URL.revokeObjectURL(url); resolve(out);
    };
    img.onerror = reject; img.src = url;
  });
}
function renderThumbs() {
  $("#drop").hidden = files.length > 0;
  $("#thumbs").hidden = !files.length;
  $("#thumbs").innerHTML = files.map((f) => `<div><img src="${f.thumb}" alt=""><button class="rm" data-id="${f.id}">×</button></div>`).join("") +
    `<button class="add" title="+">+</button>`;
  $$("#thumbs .rm").forEach((b) => (b.onclick = () => { files = files.filter((x) => x.id !== b.dataset.id); renderThumbs(); }));
  $("#thumbs .add").onclick = () => $("#file").click();
  updateRun();
}
function updateRun() {
  const n = files.length;
  $("#run").disabled = !n;
  $("#run").textContent = n ? t("runN", n) : t("run");
  $("#runHint").textContent = n ? t("hintAdd") : "";
}

// ---------- обработка (пресеты из /presets.js; качество — лучшее по умолчанию) ----------
const jobs = [];
$("#run").onclick = () => {
  if (!ENT.canProcess) return openPaywall();
  const s = { presetId: preset.id, prompt: preset.p() };
  for (const f of files) { const job = { file: f, s, state: "wait" }; jobs.unshift(job); createCard(job, $("#results")); }
  files = []; renderThumbs(); pump();
};
let active = 0;
function pump() {
  while (active < 3) {
    const job = jobs.slice().reverse().find((j) => j.state === "wait");
    if (!job) break;
    active++;
    processJob(job).finally(() => { active--; pump(); });
  }
}
async function processJob(job) {
  const set = (o) => { Object.assign(job, o); if (job.state !== "deleted") updateCard(job); };
  set({ state: "send", error: null, resultUrl: null });
  try {
    const r = await api("/api/jobs", { preset: job.s.presetId, prompt: job.s.prompt, image: job.file.dataUrl, thumb: job.file.thumb, name: job.file.name });
    setEntitlement(r);
    job.started = Date.now();
    while (true) {
      await new Promise((res) => setTimeout(res, 2000));
      set({ state: "proc" });
      const st = await api(`/api/jobs/${r.id}`);
      if (st.job.status === "done") { setEntitlement(st); set({ state: "done", resultUrl: st.job.result_url }); break; }
      if (st.job.status === "failed") { setEntitlement(st); set({ state: "err", error: t("st_err") }); break; }
      if (Date.now() - job.started > 8 * 60 * 1000) throw Object.assign(new Error(), { code: "long" });
    }
  } catch (e) {
    if (e.code === "subscription_required" || e.code === "limit_reached") openPaywallOrAccount(e.code);
    set({ state: "err", error: e.code === "long" ? t("e_long") : errText(e.code) });
  }
}
function openPaywallOrAccount(code) { if (code === "limit_reached") toast(errText(code), 5000); else openPaywall(); }

// ---------- карточки ----------
const resultSrc = (url) => `/api/download?inline=1&url=${encodeURIComponent(url)}`;
function baHTML(before, after) {
  return `<div class="ba"><img class="after" src="${after || before}" alt=""><img class="before" src="${before}" alt="">
    <div class="bar"></div><input type="range" min="0" max="100" value="50" aria-label="before / after"></div>`;
}
function wireBA(root) {
  const range = root.querySelector("input[type=range]");
  const apply = () => { root.querySelector(".before").style.clipPath = `inset(0 ${100 - range.value}% 0 0)`; root.querySelector(".bar").style.left = range.value + "%"; };
  range.oninput = apply; apply();
}
function cardHTML({ before, resultUrl, name, presetId, sub, error, busy, actions }) {
  return `${baHTML(before, resultUrl ? resultSrc(resultUrl) : null)}
    <div class="meta"><div><div class="name">${escapeHtml(name)}</div><div class="sub">${t("p_" + presetId)}${sub ? " · " + sub : ""}</div>
    ${error ? `<div class="err">${escapeHtml(error)}</div>` : ""}</div><div class="acts">${actions}</div></div>`;
}
function finishCard(el, done, busyText) {
  if (busyText) el.querySelector(".ba").insertAdjacentHTML("beforeend", `<div class="ov"><div><span class="spin"></span>${escapeHtml(busyText)}</div></div>`);
  if (!done) el.querySelectorAll(".ba .bar, .ba input").forEach((n) => (n.style.display = "none"));
  else wireBA(el);
}
function createCard(job, container) {
  const el = document.createElement("div");
  el.className = "card"; job.el = el; container.prepend(el); updateCard(job);
}
function statusText(job) {
  if (job.state === "wait") return t("st_wait");
  if (job.state === "send") return t("st_send");
  return t("st_proc", Math.round((Date.now() - (job.started || Date.now())) / 1000));
}
function updateCard(job) {
  const done = job.state === "done", busy = !done && job.state !== "err";
  job.el.innerHTML = cardHTML({
    before: job.file.thumb, resultUrl: done ? job.resultUrl : null, name: job.file.name, presetId: job.s.presetId, error: job.error,
    actions: `${done ? `<button class="btn ghost sm" data-a="full">⤢</button><button class="btn sm" data-a="dl">${t("dl")}</button>` : ""}
      ${!busy ? `<button class="btn ghost sm" data-a="retry">${t("again")}</button>` : ""}`,
  });
  finishCard(job.el, done, busy ? statusText(job) : null);
  job.el.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => {
    if (b.dataset.a === "dl") return download(job.resultUrl, job.file.name, job.s.presetId);
    if (b.dataset.a === "full") return openModal(job.file.thumb, job.resultUrl);
    if (b.dataset.a === "retry") { if (!ENT.canProcess) return openPaywall(); job.state = "wait"; job.error = null; updateCard(job); pump(); }
  }));
}
setInterval(() => jobs.filter((j) => j.state === "proc").forEach(updateCard), 1000);

// ---------- история ----------
let histCursor = null;
async function loadHistory(reset) {
  if (reset) { $("#history").innerHTML = ""; histCursor = null; }
  const { jobs: list } = await api("/api/jobs" + (histCursor ? `?before=${encodeURIComponent(histCursor)}` : ""));
  for (const j of list) {
    const el = document.createElement("div");
    el.className = "card";
    const done = j.status === "done";
    const before = j.has_thumb ? `/api/jobs/${j.id}/thumb` : done ? resultSrc(j.result_url) : "";
    el.innerHTML = cardHTML({
      before, resultUrl: done ? j.result_url : null, name: j.name || "photo", presetId: j.preset,
      sub: new Date(j.created_at).toLocaleDateString(lang === "en" ? "en-US" : lang),
      error: j.status === "failed" ? t("st_err") : null,
      actions: `${done ? `<button class="btn ghost sm" data-a="full">⤢</button><button class="btn sm" data-a="dl">${t("dl")}</button>` : ""}
        ${["done", "failed"].includes(j.status) ? `<button class="btn ghost sm" data-a="del" title="${t("del")}">×</button>` : ""}`,
    });
    finishCard(el, done, ["queued", "running"].includes(j.status) ? t("st_proc", "…") : null);
    el.querySelectorAll("[data-a]").forEach((b) => (b.onclick = async () => {
      if (b.dataset.a === "dl") return download(j.result_url, j.name || "photo", j.preset);
      if (b.dataset.a === "full") return openModal(before, j.result_url);
      if (b.dataset.a === "del") { await api(`/api/jobs/${j.id}`, undefined, "DELETE").catch(() => {}); el.remove(); }
    }));
    $("#history").appendChild(el);
  }
  histCursor = list.length ? list[list.length - 1].created_at : histCursor;
  $("#histMore").hidden = list.length < 60;
  $("#histEmpty").hidden = $("#history").children.length > 0;
}
$("#histMore").onclick = () => loadHistory(false);

// ---------- скачивание (с пометкой для изменённых фото) ----------
const markOn = () => store.get("mark") !== "0";
async function download(url, name, presetId) {
  const fname = `${name}_${presetId}.jpg`;
  try {
    let blob = await (await fetch(resultSrc(url))).blob();
    if (markOn() && presetById(presetId).staging) blob = await addLabel(blob, t("watermark"));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch {
    location.href = `/api/download?url=${encodeURIComponent(url)}&name=${encodeURIComponent(fname)}`;
  }
}
function addLabel(blob, text) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const g = c.getContext("2d");
      g.drawImage(img, 0, 0);
      const fs = Math.max(14, Math.round(c.width / 70));
      g.font = `600 ${fs}px Manrope, sans-serif`;
      const pad = fs * 0.6, w = g.measureText(text).width + pad * 2, h = fs + pad * 1.4;
      const x = c.width - w - fs, y = c.height - h - fs;
      g.fillStyle = "rgba(0,0,0,0.55)";
      g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, fs * 0.4) : g.rect(x, y, w, h); g.fill();
      g.fillStyle = "#fff"; g.textBaseline = "middle"; g.fillText(text, x + pad, y + h / 2);
      c.toBlob((b) => (b ? resolve(b) : reject()), "image/jpeg", 0.93);
    };
    img.onerror = reject; img.src = URL.createObjectURL(blob);
  });
}

function openModal(before, url) {
  $("#modalBody").innerHTML = baHTML(before, resultSrc(url));
  wireBA($("#modalBody")); $("#modal").classList.add("show");
}
$("#modalClose").onclick = () => $("#modal").classList.remove("show");
$("#modal").onclick = (e) => { if (e.target.id === "modal") $("#modal").classList.remove("show"); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $$(".modal.show, #accDlg.show, #paywall.show").forEach((m) => m.classList.remove("show")); });

// ---------- аккаунт ----------
function renderSubBlock() {
  const s = ENT.subscription, box = $("#accSub");
  let html = "";
  if (s.active && s.provider === "apple") html = `<p class="sub">${t("subActive", fmtDate(s.expiresAt))}<br>${t("subApple")}</p>`;
  else if (s.active && s.cancelAtPeriodEnd) html = `<p class="sub">${t("subEnds", fmtDate(s.expiresAt))}</p><button class="btn sm" id="resumeSub">${t("resumeSub")}</button>`;
  else if (s.active) html = `<p class="sub">${t("subActive", fmtDate(s.expiresAt))} · ${t("usageSub", ENT.usage.remaining, ENT.usage.limit)}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="cancelSub">${t("cancelSub")}</button><button class="btn ghost sm" id="portal">${t("manageCard")}</button></div>`;
  else html = `<p class="sub">${t("subNone")}${ENT.credits ? " · " + t("usageFree", ENT.credits) : ""}</p><button class="btn sm" data-subscribe>${t("planCta")} · ${planPrice()} ${t("perWeek")}</button>`;
  box.innerHTML = html;
  const cancel = $("#cancelSub");
  if (cancel) cancel.onclick = async () => {
    if (!cancel.dataset.sure) { cancel.dataset.sure = 1; cancel.textContent = t("cancelConfirm"); return; }
    try { setEntitlement(await api("/api/billing/cancel", {})); toast(t("canceledOk"), 5000); renderSubBlock(); } catch (e) { toast(errText(e.code)); }
  };
  const resume = $("#resumeSub");
  if (resume) resume.onclick = async () => {
    try { setEntitlement(await api("/api/billing/resume", {})); toast(t("resumedOk")); renderSubBlock(); } catch (e) { toast(errText(e.code)); }
  };
  const portal = $("#portal");
  if (portal) portal.onclick = async () => { try { location.href = (await api("/api/billing/portal", {})).url; } catch (e) { toast(errText(e.code)); } };
}
async function loadMyPayments() {
  try {
    const { payments } = await api("/api/me/payments");
    $("#myPayments").innerHTML = payments.length ? payments.slice(0, 8).map((p) => {
      const links = [p.receipt_url && `<a href="${escapeHtml(p.receipt_url)}" target="_blank" rel="noopener">${t("receipt")}</a>`,
        (p.invoice_pdf || p.invoice_url) && `<a href="${escapeHtml(p.invoice_pdf || p.invoice_url)}" target="_blank" rel="noopener">${t("invoice")}</a>`].filter(Boolean).join(" · ");
      return `<div class="acc-row"><span>${new Date(p.created_at).toLocaleDateString(lang === "en" ? "en-US" : lang)} · ${p.pack === "weekly" ? t("weekly") : t("photos", p.credits)}
        · <b>${money(p.amount_cents, p.currency)}</b>${p.refunded_cents ? ` <span class="muted">(${t("refunded")})</span>` : ""}</span><span>${links}</span></div>`;
    }).join("") : `<div class="acc-row muted">${t("noPayments")}</div>`;
  } catch { $("#myPayments").textContent = ""; }
}
function openAccount() {
  $("#accEmail").textContent = ME.email;
  $("#adminLink").hidden = !ME.isAdmin;
  $("#mark").checked = markOn();
  $("#accLegal").innerHTML = legalLinksHTML();
  renderSubBlock(); loadMyPayments();
  $("#accDlg").classList.add("show");
}
$("#avatar").onclick = openAccount;
$("#accDlg").addEventListener("click", (e) => { if (e.target.id === "accDlg") $("#accDlg").classList.remove("show"); });
$("#mark").onchange = (e) => store.set("mark", e.target.checked ? "1" : "0");
$("#copyRef").onclick = async () => {
  const link = `${location.origin}/?ref=${ME.refCode}`;
  try { await navigator.clipboard.writeText(link); toast(t("copied")); } catch { toast(link, 6000); }
};
$("#pwSave").onclick = async () => {
  $("#pwErr").textContent = "";
  try { await api("/api/me/password", { current: $("#pwCur").value, next: $("#pwNew").value }); toast(t("saved")); $("#pwCur").value = $("#pwNew").value = ""; }
  catch (e) { $("#pwErr").textContent = errText(e.code); }
};
$("#logout").onclick = async () => { await api("/api/auth/logout", {}).catch(() => {}); location.href = "/"; };
$("#delGo").onclick = async () => {
  $("#delErr").textContent = "";
  try { await api("/api/me/delete", { password: $("#delPass").value }); location.href = "/"; }
  catch (e) { $("#delErr").textContent = errText(e.code); }
};

// ---------- старт ----------
async function refreshMe() {
  const me = await api("/api/me");
  window.ME = me.user;
  $("#avatar").textContent = me.user.email[0].toUpperCase();
  setEntitlement(me);
  return me;
}
onLang(() => { renderChips(); updateRun(); renderUsage(); jobs.forEach(updateCard); if (!$("#viewHistory").hidden) loadHistory(true); });
async function startApp() {
  await loadConfig();
  applyLang();
  renderChips();
  try {
    const me = await refreshMe();
    if (me.user.lang && me.user.lang !== lang && !store.get("lang")) setLang(me.user.lang);
  } catch (e) {
    if (e.status !== 401) return toast(errText(e.code || "default"), 5000);
    return openAuth(new URLSearchParams(location.search).has("login") ? "in" : "up", {
      locked: true,
      onDone: async () => { const me = await refreshMe(); toast(t("welcome", me.credits), 4000); afterLogin(); },
    });
  }
  afterLogin();
}
async function afterLogin() {
  const qs = new URLSearchParams(location.search);
  if (qs.get("paid")) {
    try {
      const sid = qs.get("session_id");
      if (sid) setEntitlement(await api(`/api/checkout/confirm?session_id=${encodeURIComponent(sid)}`));
      toast(ENT.subscription.active ? t("subscribed") : t("paidPending"), 5000);
    } catch { toast(t("paid")); }
  }
  if (qs.get("canceled")) toast(t("canceled"));
  if (qs.has("subscribe") && !ENT.subscription.active) openPaywall();
  if ([...qs.keys()].length) history.replaceState(null, "", "/app");
}
startApp();
</script>
