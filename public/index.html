<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realty Photo AI — listing photos that sell</title>
<meta name="description" content="AI photo editing for real estate agents: virtual staging, HDR, sky replacement, twilight. One weekly plan." />
<link rel="stylesheet" href="/common.css" />
<style>
  main { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .hero { text-align: center; padding: 72px 0 40px; }
  .hero h1 { font-size: clamp(40px, 6.4vw, 72px); line-height: 1; letter-spacing: -.045em; margin: 0 auto 18px; font-weight: 700; max-width: 820px; }
  .hero p { font-size: 19px; color: var(--muted); margin: 0 auto 30px; max-width: 520px; }
  .hero .note { font-size: 13px; color: var(--muted); margin-top: 14px; }

  .demo { position: relative; aspect-ratio: 16/10; border-radius: 24px; overflow: hidden; background: var(--soft); user-select: none; margin: 8px 0 0; }
  .demo > svg, .demo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .demo .before { clip-path: inset(0 50% 0 0); }
  .demo .bar { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; pointer-events: none; }
  .demo .bar::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 38px; height: 38px; border-radius: 50%; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
  .demo input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .demo .tag { position: absolute; bottom: 16px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.9); font-size: 12px; font-weight: 600; pointer-events: none; }
  .demo .tag.l { left: 16px; } .demo .tag.r { right: 16px; }
  .demo-tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  .demo-tabs button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .demo-tabs button.on { background: var(--soft); color: var(--ink); }

  section { padding: 96px 0 0; }
  h2 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.035em; line-height: 1.08; margin: 0 0 14px; font-weight: 700; }
  .lead { color: var(--muted); font-size: 17px; margin: 0 0 30px; max-width: 560px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .tools span { padding: 9px 14px; border-radius: 999px; background: var(--soft); font-size: 14px; font-weight: 500; }
  .pricing { display: grid; grid-template-columns: 1fr 380px; gap: 48px; align-items: center; }
  @media (max-width: 820px) { .pricing { grid-template-columns: 1fr; gap: 24px; } }
  details { border-top: 1px solid var(--line); padding: 18px 0; }
  details:last-child { border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  summary::after { content: "+"; color: var(--muted); }
  details[open] summary::after { content: "–"; }
  details p { color: var(--muted); margin: 10px 0 0; }
  footer { max-width: 1040px; margin: 96px auto 0; padding: 28px 24px 40px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" id="brand"></a>
  <div class="hright">
    <span id="langSlot"></span>
    <button class="btn ghost sm" id="loginBtn" data-i18n="login"></button>
  </div>
</header>

<main>
  <div class="hero">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroSub"></p>
    <button class="btn lg" id="ctaHero"></button>
    <div class="note" id="heroNote"></div>
  </div>

  <div class="demo" id="demo">
    <svg class="after" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="640" height="290" fill="#f4efe6"/><rect y="290" width="640" height="110" fill="#d8b98f"/>
      <rect x="400" y="60" width="170" height="190" fill="#bfe1f6" stroke="#fff" stroke-width="10"/>
      <path d="M485 60v190M400 155h170" stroke="#fff" stroke-width="6"/>
      <rect x="120" y="85" width="120" height="84" fill="#fff" stroke="#d9cdb8" stroke-width="5"/>
      <ellipse cx="250" cy="352" rx="200" ry="32" fill="#efe8dc"/>
      <rect x="80" y="232" width="320" height="68" rx="18" fill="#2f2f2f"/><rect x="96" y="202" width="288" height="52" rx="16" fill="#3a3a3a"/>
      <rect x="128" y="218" width="60" height="38" rx="10" fill="#e9dcc3"/><rect x="292" y="218" width="60" height="38" rx="10" fill="#d6d0c4"/>
      <ellipse cx="245" cy="340" rx="70" ry="13" fill="#8a6a4a"/>
      <path d="M470 300V172" stroke="#222" stroke-width="4"/><path d="M446 176h48l-10-34h-28z" fill="#f2e6cc"/>
      <path d="M560 300l-12-40h44l-12 40z" fill="#c9a37a"/><ellipse cx="570" cy="230" rx="14" ry="34" fill="#5f8a6a"/>
    </svg>
    <svg class="before" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="640" height="290" fill="#cfcac0"/><rect y="290" width="640" height="110" fill="#9f8a70"/>
      <rect x="400" y="60" width="170" height="190" fill="#efefed" stroke="#dcd7cc" stroke-width="10"/>
      <path d="M485 60v190M400 155h170" stroke="#dcd7cc" stroke-width="6"/>
      <rect x="150" y="318" width="50" height="30" fill="#b9a47f" transform="rotate(-8 175 333)"/>
      <rect width="640" height="400" fill="#3a4450" opacity=".12"/>
    </svg>
    <div class="bar"></div>
    <span class="tag l" data-i18n="before"></span><span class="tag r" data-i18n="after"></span>
    <input type="range" min="0" max="100" value="50" aria-label="before / after" id="demoRange" />
  </div>
  <div class="demo-tabs" id="demoTabs" hidden></div>

  <section>
    <h2 data-i18n="toolsTitle"></h2>
    <p class="lead" data-i18n="toolsLead"></p>
    <div class="tools" id="tools"></div>
  </section>

  <section id="pricing" class="pricing">
    <div>
      <h2 data-i18n="priceTitle"></h2>
      <p class="lead" data-i18n="priceLead"></p>
    </div>
    <div id="planBox"></div>
  </section>

  <section>
    <h2 data-i18n="faqTitle"></h2>
    <div id="faqList" style="margin-top:20px"></div>
  </section>
</main>

<footer><span id="foot"></span><span id="legalLinks"></span></footer>

<script src="/common.js"></script>
<script>
Object.assign(PAGE_I18N.ru, {
  heroTitle: "Фото, которые продают квартиры", heroSub: "Меблировка, HDR, новое небо и вечерний свет — за 30 секунд с телефона.",
  ctaFree: (n) => `Попробовать — ${n} фото бесплатно`, heroNote: (p) => `Затем ${p} в неделю · отмена в любой момент`,
  before: "До", after: "После",
  toolsTitle: "Всё в одном месте", toolsLead: "Загрузите снимок, выберите, что сделать, — и скачайте готовое фото.",
  tools: ["Авто‑улучшение", "Меблировка", "Убрать хлам", "Пустая комната", "Новое небо", "Вечерний свет", "Газон и двор", "Свежий ремонт", "Апскейл 4K", "Своя задача"],
  priceTitle: "Один тариф", priceLead: "Без пакетов и сложных цен. Обрабатывайте каждую неделю — отмените, когда не нужно.",
  faqTitle: "Вопросы",
  faq: [
    ["Как работает подписка?", "Подписка продлевается каждую неделю. Отменить можно в аккаунте в любой момент — доступ сохранится до конца оплаченной недели."],
    ["Что если лимит закончился?", "Лимит обновляется в начале каждого оплаченного периода. Если обработка не удалась, фото не засчитывается."],
    ["Можно публиковать на Idealista и Fotocasa?", "Да. На изменённые фото автоматически добавляется пометка «Виртуальный стейджинг», как требуют порталы."],
    ["Меняется ли планировка?", "Нет. Стены, окна и ракурс остаются прежними — меняется только то, что вы выбрали."],
  ],
});
Object.assign(PAGE_I18N.es, {
  heroTitle: "Fotos que venden pisos", heroSub: "Amueblado, HDR, cielo nuevo y luz de atardecer — en 30 segundos desde el móvil.",
  ctaFree: (n) => `Probar — ${n} fotos gratis`, heroNote: (p) => `Después ${p} a la semana · cancela cuando quieras`,
  before: "Antes", after: "Después",
  toolsTitle: "Todo en un sitio", toolsLead: "Sube la foto, elige qué hacer y descarga el resultado.",
  tools: ["Mejora automática", "Amueblar", "Despejar", "Estancia vacía", "Cielo nuevo", "Atardecer", "Jardín", "Renovar", "Escalado 4K", "Tarea propia"],
  priceTitle: "Un solo plan", priceLead: "Sin packs ni precios complicados. Úsalo cada semana y cancélalo cuando no lo necesites.",
  faqTitle: "Preguntas",
  faq: [
    ["¿Cómo funciona la suscripción?", "Se renueva cada semana. Puedes cancelarla en tu cuenta cuando quieras y mantienes el acceso hasta el final de la semana pagada."],
    ["¿Y si se acaba el límite?", "El límite se renueva al inicio de cada periodo pagado. Si un procesamiento falla, la foto no cuenta."],
    ["¿Puedo publicar en Idealista y Fotocasa?", "Sí. Las fotos modificadas llevan la marca «Amueblado virtual», como exigen los portales."],
    ["¿Cambia la distribución?", "No. Paredes, ventanas y encuadre se mantienen: solo cambia lo que eliges."],
  ],
});
Object.assign(PAGE_I18N.en, {
  heroTitle: "Listing photos that sell", heroSub: "Staging, HDR, new skies and twilight light — in 30 seconds, from your phone.",
  ctaFree: (n) => `Try it — ${n} free photos`, heroNote: (p) => `Then ${p} per week · cancel anytime`,
  before: "Before", after: "After",
  toolsTitle: "Everything in one place", toolsLead: "Upload a photo, pick what to do, download the result.",
  tools: ["Auto enhance", "Virtual staging", "Declutter", "Empty room", "New sky", "Twilight", "Lawn & yard", "Fresh paint", "4K upscale", "Custom task"],
  priceTitle: "One plan", priceLead: "No packs, no complicated pricing. Use it every week, cancel when you don't need it.",
  faqTitle: "Questions",
  faq: [
    ["How does the subscription work?", "It renews every week. Cancel anytime in your account — you keep access until the end of the paid week."],
    ["What if I hit the limit?", "The limit resets at the start of each paid period. Failed edits don't count."],
    ["Can I publish on listing portals?", "Yes. Edited photos get a “Virtually staged” label, as portals require."],
    ["Does it change the layout?", "No. Walls, windows and framing stay the same — only what you choose changes."],
  ],
});

$("#brand").innerHTML = BRAND_SVG + "<span class=\"bt\">Realty Photo AI</span>";
$("#langSlot").outerHTML = langSwitcherHTML();

// до/после
const range = $("#demoRange");
const applyDemo = () => {
  $("#demo .before").style.clipPath = `inset(0 ${100 - range.value}% 0 0)`;
  $("#demo .bar").style.left = range.value + "%";
};
range.oninput = applyDemo; applyDemo();

// реальные пары из админки
const PRESET_ORDER = ["enhance", "staging", "declutter", "empty", "sky", "twilight", "lawn", "refresh", "upscale", "custom"];
let DEMOS = [], demoIdx = 0, demoTimer = null;
const demoName = (p) => t("tools")[PRESET_ORDER.indexOf(p)] || p;
function showDemo(i) {
  demoIdx = i;
  const d = DEMOS[i], box = $("#demo");
  box.querySelectorAll("svg, img").forEach((n) => n.remove());
  const a = new Image(), b = new Image();
  a.className = "after"; b.className = "before"; a.alt = demoName(d.preset); b.alt = "";
  a.src = `/demo-img/${d.id}/after?v=${d.v}`; b.src = `/demo-img/${d.id}/before?v=${d.v}`;
  box.prepend(b); box.prepend(a);
  range.value = 50; applyDemo();
  $$("#demoTabs button").forEach((x, k) => x.classList.toggle("on", k === i));
}
function renderDemoTabs() {
  if (!DEMOS.length) return;
  $("#demoTabs").hidden = DEMOS.length < 2;
  $("#demoTabs").innerHTML = DEMOS.map((d, k) => `<button class="${k === demoIdx ? "on" : ""}">${escapeHtml(demoName(d.preset))}</button>`).join("");
  $$("#demoTabs button").forEach((x, k) => (x.onclick = () => { clearInterval(demoTimer); showDemo(k); }));
}
range.addEventListener("pointerdown", () => clearInterval(demoTimer));
fetch("/api/demos").then((r) => r.json()).then(({ demos }) => {
  if (!demos?.length) return;
  DEMOS = demos; renderDemoTabs(); showDemo(0);
  if (DEMOS.length > 1) demoTimer = setInterval(() => showDemo((demoIdx + 1) % DEMOS.length), 6000);
}).catch(() => {});

let loggedIn = false;
const start = () => (loggedIn ? (location.href = "/app") : openAuth("up"));
$("#ctaHero").onclick = start;
$("#loginBtn").onclick = () => (loggedIn ? (location.href = "/app") : openAuth("in"));
// на главной кнопка тарифа ведёт в регистрацию (подписка оформляется в приложении)
$("#planBox").addEventListener("click", (e) => {
  if (!e.target.closest("[data-subscribe]")) return;
  e.stopPropagation();
  loggedIn ? (location.href = "/app?subscribe") : openAuth("up", { onDone: () => (location.href = "/app?subscribe") });
}, true);

function render() {
  const c = CONFIG || {};
  $("#ctaHero").textContent = loggedIn ? t("openApp") : t("ctaFree", c.freeCredits ?? 3);
  $("#heroNote").textContent = t("heroNote", planPrice());
  $("#loginBtn").textContent = loggedIn ? t("openApp") : t("login");
  $("#tools").innerHTML = t("tools").map((x) => `<span>${x}</span>`).join("");
  $("#planBox").innerHTML = planHTML();
  $("#faqList").innerHTML = t("faq").map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("");
  $("#foot").innerHTML = `© ${new Date().getFullYear()} ${escapeHtml(c.legal?.name || c.brand || "Realty Photo AI")}${c.supportEmail ? ` · <a href="mailto:${escapeHtml(c.supportEmail)}">${escapeHtml(c.supportEmail)}</a>` : ""}`;
  $("#legalLinks").innerHTML = legalLinksHTML();
  renderDemoTabs();
}
onLang(render);
applyLang();
loadConfig().then(async () => {
  try { const me = await api("/api/me"); window.ME = me.user; loggedIn = true; } catch {}
  applyLang();
  if (new URLSearchParams(location.search).has("signup") && !loggedIn) openAuth("up");
});
</script>
</body>
</html>
