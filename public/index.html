<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realty Photo AI — AI photo editing for real estate agents</title>
<meta name="description" content="Virtual staging, HDR enhancement, sky replacement and twilight photos for real estate listings in 30 seconds. 5 free photos." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/common.css" />
<style>
  nav.links { display: flex; gap: 22px; }
  nav.links a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  nav.links a:hover { color: var(--ink); }
  @media (max-width: 900px) { nav.links { display: none; } header.top { padding: 12px 16px; } }

  section.block { max-width: 1180px; margin: 0 auto; padding: 72px 24px; }
  .eyebrow { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; margin-bottom: 10px; }
  h2.title { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.03em; line-height: 1.1; margin: 0 0 12px; }
  p.lead { color: var(--muted); font-size: 18px; max-width: 640px; margin: 0 0 32px; }

  .hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; max-width: 1180px; margin: 0 auto; padding: 64px 24px 40px; }
  @media (max-width: 900px) { .hero { grid-template-columns: 1fr; padding-top: 36px; gap: 32px; } }
  .hero h1 { font-size: clamp(36px, 5.4vw, 60px); line-height: 1.02; letter-spacing: -.04em; margin: 0 0 18px; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { font-size: 19px; color: var(--muted); margin: 0 0 28px; max-width: 540px; }
  .hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .hero .note { font-size: 13px; color: var(--muted); margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .hero .note span::before { content: "✓ "; color: var(--accent); font-weight: 800; }

  .demo { position: relative; aspect-ratio: 3/2; border-radius: 18px; overflow: hidden; box-shadow: 0 24px 60px rgba(31,93,76,.18), 0 2px 6px rgba(0,0,0,.06); background: #ddd; user-select: none; }
  .demo > svg, .demo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .demo .before { clip-path: inset(0 50% 0 0); }
  .demo .bar { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: #fff; box-shadow: 0 0 8px rgba(0,0,0,.3); pointer-events: none; }
  .demo .bar::after { content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 42px; height: 42px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .demo input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .demo .tag { position: absolute; top: 14px; padding: 4px 10px; border-radius: 7px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; pointer-events: none; }
  .demo .tag.l { left: 14px; } .demo .tag.r { right: 14px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 1180px; margin: 0 auto; padding: 8px 24px 0; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .stat b { display: block; font-size: 28px; letter-spacing: -.02em; }
  .stat span { color: var(--muted); font-size: 14px; }
  @media (max-width: 700px) { .stats { grid-template-columns: 1fr; } }

  .features { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .feat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .feat .ic { font-size: 26px; }
  .feat h4 { margin: 8px 0 4px; font-size: 17px; }
  .feat p { margin: 0; color: var(--muted); font-size: 14px; }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; counter-reset: s; }
  @media (max-width: 800px) { .steps { grid-template-columns: 1fr; } }
  .step { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px; position: relative; }
  .step::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; margin-bottom: 12px; }
  .step h4 { margin: 0 0 4px; font-size: 18px; }
  .step p { margin: 0; color: var(--muted); }

  .compare { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .compare span { background: #fff; border: 1px solid var(--line); border-radius: 30px; padding: 6px 12px; }
  .compare b { color: var(--ink); }

  .ref { background: var(--accent); color: #fff; border-radius: 20px; padding: 40px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
  .ref h3 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.02em; }
  .ref p { margin: 0; opacity: .85; font-size: 16px; }
  @media (max-width: 800px) { .ref { grid-template-columns: 1fr; padding: 28px; } }

  details { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 700; font-size: 16px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  summary::after { content: "+"; color: var(--accent); font-size: 22px; line-height: 1; }
  details[open] summary::after { content: "−"; }
  details p { color: var(--muted); margin: 10px 0 0; }

  .final { text-align: center; }
  footer { border-top: 1px solid var(--line); padding: 28px 24px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>

// демо до/после
const range = $("#demoRange");
const applyDemo = () => {
  const v = range.value;
  $("#demo .before").style.clipPath = `inset(0 ${100 - v}% 0 0)`;
  $("#demo .bar").style.left = v + "%";
};
range.oninput = applyDemo; applyDemo();
// свои демо-фото, если владелец положил их в /demo/
(() => {
  const a = new Image(), b = new Image();
  let ok = 0;
  const done = () => {
    if (++ok < 2) return;
    a.className = "after"; b.className = "before";
    $("#demo svg.after").replaceWith(a); $("#demo svg.before").replaceWith(b); applyDemo();
  };
  a.onload = done; b.onload = done;
  a.src = "/demo/after.jpg"; b.src = "/demo/before.jpg";
})();

let loggedIn = false;
const cta = () => (loggedIn ? (location.href = "/app") : openAuth("up"));
["#ctaTop", "#ctaHero", "#ctaFinal", "#ctaRef"].forEach((s) => ($(s).onclick = cta));
$("#loginBtn").onclick = () => (loggedIn ? (location.href = "/app") : openAuth("in"));
$("#pricingBody").addEventListener("click", (e) => {
  const b = e.target.closest("[data-pack]");
  if (!b) return;
  if (b.dataset.pack === "free") return cta();
  buyPack(b.dataset.pack);
});

function render() {
  const c = CONFIG || {};
  $("#ctaHero").textContent = loggedIn ? t("openApp") : t("ctaFree", c.freeCredits || 5);
  $("#ctaFinal").textContent = $("#ctaHero").textContent;
  $("#ctaTop").textContent = loggedIn ? t("openApp") : t("tryFree");
  $("#loginBtn").hidden = loggedIn;
  $("#featGrid").innerHTML = t("feats").map(([ic, h, p]) => `<div class="feat"><div class="ic">${ic}</div><h4>${h}</h4><p>${p}</p></div>`).join("");
  $("#faqList").innerHTML = t("faq").map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("");
  $("#refText").textContent = t("refText", c.refBonus ?? 10, c.refWelcome ?? 3);
  $("#pricingBody").innerHTML = packsHTML({ withFree: true });
  $("#footBrand").textContent = c.brand || "Realty Photo AI";
  $("#support").innerHTML = c.supportEmail ? `· <a href="mailto:${escapeHtml(c.supportEmail)}">${escapeHtml(c.supportEmail)}</a>` : "";
}
