<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Información legal — Realty Photo AI</title>
<link rel="stylesheet" href="/common.css" />
<style>

  .ltabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 26px; }
  .ltabs a { text-decoration: none; color: var(--muted); font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: #fff; }
  .ltabs a.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  article { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 32px; }
  @media (max-width: 600px) { article { padding: 20px; } }
  article h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: -.02em; }
  article .upd { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  article h2 { font-size: 18px; margin: 28px 0 8px; letter-spacing: -.01em; }
  article p, article li { color: #333; font-size: 15px; }
  article ul { padding-left: 20px; }
  article table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  article td, article th { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  article th { background: #faf9f6; width: 32%; }
  .miss { background: #fff1d6; color: #8a5a00; padding: 1px 6px; border-radius: 5px; font-weight: 700; font-size: 13px; }
  .note { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--accent); margin-bottom: 20px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" id="brand"></a>
  <div class="hright"><span id="langSlot"></span><a class="btn ghost sm" href="/app" id="toApp"></a></div>
</header>
<div class="wrap">
  <nav class="ltabs" id="ltabs"></nav>
  <div class="note" id="transNote" hidden></div>
  <article id="doc"></article>
</div>
<footer id="foot"></footer>

<script src="/common.js"></script>
<script>
$("#brand").innerHTML = BRAND_SVG + "Realty Photo AI";
$("#langSlot").outerHTML = langSwitcherHTML();

const DOCS = ["aviso-legal", "privacidad", "condiciones", "cookies"];
let docId = location.pathname.replace("/", "");
if (!DOCS.includes(docId)) docId = (location.hash || "").slice(1) || "aviso-legal";
if (!DOCS.includes(docId)) docId = "aviso-legal";

const UPDATED = { es: "8 de noviembre de 2026", en: "8 November 2026", ru: "8 ноября 2026 г." };

function render() {
  const c = CONFIG || {}, L = c.legal || {};
  const miss = (k) => `<span class="miss">[${{ es: "pendiente", en: "pending", ru: "не заполнено" }[lang]}: LEGAL_${k}]</span>`;
  const v = (k, key) => (L[k] ? escapeHtml(L[k]) : miss(key));
  const brand = escapeHtml(c.brand || "Realty Photo AI");
  const site = escapeHtml(location.origin);
  const email = L.email ? `<a href="mailto:${escapeHtml(L.email)}">${escapeHtml(L.email)}</a>` : miss("EMAIL");
  const owner = v("name", "NAME");
  const vat = L.vatIncluded !== false;
  const D = TEXTS[lang]({ brand, site, email, owner, v, L, c, vat });

  $("#ltabs").innerHTML = DOCS.map((d) => `<a href="/${d}" class="${d === docId ? "on" : ""}">${D.tabs[d]}</a>`).join("");
  const doc = D.docs[docId];
  $("#doc").innerHTML = `<h1>${doc.title}</h1><div class="upd">${D.updated}: ${UPDATED[lang]}</div>${doc.body}`;
  $("#transNote").hidden = lang === "es";
  $("#transNote").textContent = D.transNote || "";
  $("#toApp").textContent = t("openApp");
  $("#foot").innerHTML = `© ${new Date().getFullYear()} ${owner} · ${brand}`;
  document.title = `${doc.title} — ${c.brand || "Realty Photo AI"}`;
}

// Таблица с данными владельца (общая для aviso и privacidad)
const ownerTable = ({ v, email, site }, labels) => `<table>
  <tr><th>${labels.name}</th><td>${v("name", "NAME")}</td></tr>
  <tr><th>${labels.nif}</th><td>${v("nif", "NIF")}</td></tr>
  <tr><th>${labels.address}</th><td>${v("address", "ADDRESS")}</td></tr>
  <tr><th>Email</th><td>${email}</td></tr>
  ${CONFIG?.legal?.phone ? `<tr><th>${labels.phone}</th><td>${escapeHtml(CONFIG.legal.phone)}</td></tr>` : ""}
  ${CONFIG?.legal?.registry ? `<tr><th>${labels.registry}</th><td>${escapeHtml(CONFIG.legal.registry)}</td></tr>` : ""}
  <tr><th>${labels.web}</th><td>${site}</td></tr></table>`;
